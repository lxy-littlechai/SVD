[connectivity]
nk=TopPL:{{task_num}}


{% for graphs in orth_graph_list %}
{% for graph in graphs %}
{% for j in range(0, IO_NUM) %}
sc = TopPL_{{graph['task_id']}}.sweep_tx{{graph['graph_id']}}_L_{{j}}:ai_engine_0.{{graph['task_id']}}_{{graph['graph_id']}}_sweep_in_L_{{j}}
sc = ai_engine_0.{{graph['task_id']}}_{{graph['graph_id']}}_sweep_out_L_{{j}}:TopPL_{{graph['task_id']}}.sweep_rx{{graph['graph_id']}}_L_{{j}}
sc = TopPL_{{graph['task_id']}}.sweep_tx{{graph['graph_id']}}_R_{{j}}:ai_engine_0.{{graph['task_id']}}_{{graph['graph_id']}}_sweep_in_R_{{j}}
sc = ai_engine_0.{{graph['task_id']}}_{{graph['graph_id']}}_sweep_out_R_{{j}}:TopPL_{{graph['task_id']}}.sweep_rx{{graph['graph_id']}}_R_{{j}}
{% endfor %}
{% endfor %}
{% endfor %}

{% for graphs in norm_graph_list %}
{% for graph in graphs %}
sc = TopPL_{{graph['task_id']}}.norm_tx0:ai_engine_0.{{graph['task_id']}}_{{graph['graph_id']}}_norm_in_0
sc = ai_engine_0.{{graph['task_id']}}_{{graph['graph_id']}}_norm_out_0:TopPL_{{graph['task_id']}}.norm_rx0  
{% endfor %}
{% endfor %}

